[project]
name = "laya-router"
version = "0.1.0"
description = "Generic text-to-label router over Laya (calibrated, non-generative)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "laya>=0.3.23",
    "pyyaml",
    # Declared directly (not only transitively via `laya`) so the CPU-only
    # wheel index below actually applies; `laya`'s own `torch>=2.0.0` would
    # otherwise resolve to the multi-GB CUDA build from PyPI.
    "torch>=2.0.0",
]

# `laya` depends on `torch`, whose default Linux wheels pull several GB of CUDA
# libraries. This project targets CPU inference, so torch is pinned to the
# CPU-only wheel index (no `nvidia-*` payload). Install a CUDA build explicitly
# (e.g. via an extra index) only if a GPU host is intended.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_router"]

[project.scripts]
laya-router = "laya_router.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
# The fast gate runs unit tests only; the real-Laya test is opt-in.
addopts = "-m 'not integration'"
markers = [
    "integration: downloads and runs the real Laya checkpoint (slow)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pyright]
include = ["src", "tests"]
